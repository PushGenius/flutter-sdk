name: pushgenius
description: PushGenius Flutter plugin for push notifications on iOS and Android.
version: 0.2.0
homepage: https://pushgeni.us
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: us.pushgeni.flutter
        pluginClass: PushGeniusPlugin
      ios:
        pluginClass: PushGeniusPlugin
